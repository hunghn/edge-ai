# Every gate/threshold of the S0–S10 pipeline. Code never hardcodes these values.
# `null` = not decided yet (spec defers to §6 / §6.3 or does not specify). While a
# match/decision value is null, the engine routes every result to `review_required`.

backend: ort                      # ort (dev) | trt (Nano)

models:
  dir: models/onnx                # nano.yaml points this at models/engines
  detector: det_500m
  landmark: 2d106det
  recognizer: w600k_mbf
  antispoof_v2: minifasnet_v2_2.7
  antispoof_v1se: minifasnet_v1se_4.0

capture:                          # S0
  source: gstreamer               # gstreamer | file | usb
  width: 1920                     # C-13: keep 1080p in the ring buffer
  height: 1080
  fps: 15                         # spec: 10–15 FPS; only paces `file` sources
  fourcc: MJPG                    # USB webcam: MJPG gives 15 FPS, YUYV only 9
  read_fail_max: 30               # consecutive failed reads before reopening the camera
  reconnect_s: 2.0

detect:                           # S1
  input_size: [640, 640]          # letterboxed, see models/scrfd.py
  score_min: 0.6
  nms_iou: 0.4                    # from reference scrfd.py

subject:                          # S2
  roi: null                       # TBD (D-06): [x1, y1, x2, y2] as fractions of the frame
  min_side_px: 110
  min_side_space: det             # TBD (D-07): 'det' = 640x640 input, 'frame' = full frame

pose_coarse:                      # S3, from 5 keypoints
  yaw_max_deg: 25
  roll_max_deg: 20
  k_yaw: null                     # TBD (D-15): nose-offset -> degrees; null gates roll only

antispoof:                        # S4
  p_real_min: 0.85                # TBD confirm: applied to (softmax_v2 + softmax_v1se) / 2
  real_class_index: 1             # 0 = print, 1 = real, 2 = replay
  evidence:                       # C-16: face crop only, JPEG, 7-day TTL
    save: crop                    # crop | frame | none
    crop_scale: 4.0
    jpeg_quality: 90
    ttl_days: 7
  crops:
    - model: antispoof_v2
      scale: 2.7
    - model: antispoof_v1se
      scale: 4.0
  input_size: [80, 80]

landmark:                         # S5
  input_size: 192
  bbox_expand: 1.5

pose_fine:                        # S5, solvePnP on 106 landmarks
  yaw_max_deg: 15
  pitch_max_deg: 15
  roll_max_deg: 10

iqa:                              # S5 — thresholds only mean something with a fixed
  blur_min: 60                    # measurement area (D-11), hence crop_shrink/crop_size
  lum_min: 60
  lum_max: 200
  crop_shrink: 0.8                # face box shrunk to drop background
  crop_size: 112                  # resized to this square before measuring

camera:                           # S5 solvePnP intrinsics (D-10)
  K: null                         # null -> approximated as f = image width
  dist: null

align:                            # S6
  image_size: 112
  kps_source: scrfd               # TBD (D-09): scrfd | lmk106
  max_residual_px: null           # null -> no sanity check on the 5-point fit

best_frame:                       # S8
  k_max: 5
  window_s: 1.5
  min_good: 3
  quality_score: null             # TBD (D-08): A | B | C; null keeps frames FIFO
  quality_params: {}
  continuity:                     # TBD (D-31): keep one person per collection window
    iou_min: null
    max_gap_s: null
    cos_min: null

match:                            # S9 — TBD (§6)
  threshold: null
  margin_top1_top2: null
  vote_k: 3
  vote_n: 5

decision:                         # S10 — TBD (§6.3)
  rules: null

storage:
  db_path: var/edge.db            # nano.yaml overrides with /var/lib/edgeface/edge.db
  evidence_dir: var/evidence      # spoof evidence only (C-16)

retention:                        # local storage lifetime (engine runs this periodically)
  patients_hours: 24              # C-04
  sessions_days: 30               # C-17
  metrics_days: 30
  interval_s: 600

auth:                             # C-18: nurse PIN for the kiosk admin screen
  pin_length: 6
  max_failed_attempts: 5
  lockout_s: 300
  pbkdf2_iterations: 100000       # verify time on the Nano measured in M4
