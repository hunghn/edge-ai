{% extends "base.html" %}
{% block content %}
<h1>Đăng nhập quản trị</h1>
{% if error %}<div class="flash bad">Sai tên đăng nhập hoặc mật khẩu.</div>{% endif %}
<form method="post" action="/admin/login" style="display:grid;gap:12px;max-width:320px">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input name="username" placeholder="Tên đăng nhập" autofocus>
  <input name="password" type="password" placeholder="Mật khẩu">
  <button class="primary" type="submit">Đăng nhập</button>
</form>
{% endblock %}
